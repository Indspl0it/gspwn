# AGENTS.md tells agents to run tools/selftest.py before trusting the tools
# after any change to them. This enforces that on every push and PR, so the
# rule does not depend on someone remembering.
#
# Everything here is deliberately offline: no GPU, no kernel build, no root,
# no network. Anything that touches the system under test is covered by the
# phase gates on the target machine, not here.
name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python3 -m pip install --quiet pyyaml pyflakes

      - name: Offline self-test
        run: python3 tools/selftest.py

      - name: Lint
        run: python3 -m pyflakes tools/*.py

      - name: Shell syntax
        run: bash -n tools/build_kernel.sh

      - name: Shipped config is valid
        run: python3 tools/gspwn_config.py

      # The five steps below compare committed artefacts that have to agree
      # and that nothing else compares. Each reads files only, so they run in
      # the same offline job as everything above.

      - name: Committed names resolve to a description
        # tools/trace2seed.py converts a traced request number into a call by
        # name through tools/ioctl_map.json. A name the description set does
        # not declare produces a program syz-db rejects, and the map went two
        # releases carrying the two multiplexer names after the surface model
        # stopped declaring them.
        run: python3 tools/regression_check.py names

      - name: Emitted selectors are pinned
        # A control variant with a free cmd field reaches all 1372 exported
        # control commands from one description, which is the hole the
        # per-leaf denominator exists to close. syzlang_gen.py asserts the
        # same rule at emission; this step covers a description set edited by
        # hand afterwards.
        run: python3 tools/regression_check.py pins

      - name: Descriptions cover the whole denominator
        # The inventories under surface enumerate 764 targets and
        # descriptions declares the variants. A target losing its
        # description shrinks the numerator silently, because every later
        # measurement joins on the variant name.
        run: python3 tools/regression_check.py coverage

      - name: Derived artefacts still match the control inventory
        # Nothing in CI runs tools/object_graph.py chains or
        # tools/ctrl_rank.py rank, so a driver bump that moves the control
        # inventory leaves rm-chains.json and rm-control-rank.json stale with
        # no signal. tools/trace2seed.py chains and tools/syzlang_gen.py emit
        # both read them, and the seeds phase is otherwise the first thing to
        # notice, at run time, on the system under test.
        run: python3 tools/regression_check.py derived

      - name: Generated reference pages still match the artefacts
        # docs/src/content/docs/reference/surface/ renders the enumerated
        # surface: 34 escapes, 531 control commands, 155 allocation classes
        # and the 61 in-scope CVEs. Every row comes from an artefact under
        # surface, so a driver bump that moves an inventory leaves
        # the pages stating counts the tools no longer measure. The check
        # regenerates into a temporary directory and diffs, which also
        # catches a page edited by hand.
        run: python3 tools/regression_check.py pages

      - name: Documentation writing register
        # Question-shaped headings and table column headers scan as labels, so
        # a read-through does not catch them. One reference table carried the
        # same one ten times before this check existed.
        run: python3 tools/register_check.py

      - name: Prompts reference commands that exist
        # The agent prompts are the interface between the orchestrator and the
        # tools. A renamed subcommand that no prompt was updated for is a
        # runtime failure on the target, hours into a campaign.
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess, sys
          cmds, bare, uses, bad = set(), set(), [], []
          # The agent prompts are checked always; the documentation site and
          # the README are checked when they exist. Pointing this at the docs
          # tree is what makes every command example on the site verified
          # against the tools' real --help output.
          docs = sorted(glob.glob("docs/src/content/docs/**/*.md",
                                  recursive=True)
                        + glob.glob("docs/src/content/docs/**/*.mdx",
                                    recursive=True))
          optional = ["README.md"]
          scanned = glob.glob("agents/*.md") + ["AGENTS.md"] + docs + [
              p for p in optional if os.path.exists(p)]
          for p in optional:
              if not os.path.exists(p):
                  print("note: %s absent, not checked" % p)
          print("scanning %d prompt/doc file(s)" % len(scanned))
          for f in scanned:
              txt = open(f, encoding="utf-8").read()
              # The subcommand is optional. Requiring a lowercase word
              # directly after the file name skipped every invocation whose
              # first argument is a flag, and skipped its flags with it, which
              # left 21 invocations across the prompts and the docs tree
              # unchecked.
              for m in re.finditer(
                      r"tools/(\w+)\.py(?:\s+(?!--)([a-z][a-z0-9-]*))?"
                      r"((?:\s+--[a-z-]+(?:\s+\S+)?|\s+\\\n\s*)*)", txt):
                  if m.group(2):
                      cmds.add((m.group(1), m.group(2)))
                  elif m.group(3).strip():
                      bare.add((f, m.group(1)))
                  for fl in re.findall(r"--[a-z][a-z-]*", m.group(3)):
                      uses.append((f, m.group(1), m.group(2), fl))
          helps = {}
          for tool, sub in sorted(cmds):
              path = os.path.join("tools", tool + ".py")
              if not os.path.exists(path):
                  bad.append("%s does not exist" % path)
                  continue
              r = subprocess.run([sys.executable, path, "--help"],
                                 capture_output=True, text=True)
              m = re.search(r"\{([a-z0-9,\-]+)\}", r.stdout + r.stderr)
              if m and sub not in set(m.group(1).split(",")):
                  bad.append("%s has no subcommand %r" % (path, sub))
          # An invocation carrying flags and no subcommand, against a tool
          # that requires one, runs nothing. The flag loop below cannot report
          # it: it reads those flags against the tool's own --help, where a
          # subcommand's flags never appear.
          for f, tool in sorted(bare):
              path = os.path.join("tools", tool + ".py")
              if not os.path.exists(path):
                  bad.append("%s does not exist" % path)
                  continue
              r = subprocess.run([sys.executable, path, "--help"],
                                 capture_output=True, text=True)
              m = re.search(r"\{([a-z0-9,\-]+)\}", r.stdout + r.stderr)
              if m:
                  bad.append("%s: %s is invoked with no subcommand and "
                             "requires one of {%s}" % (f, path, m.group(1)))
          for f, tool, sub, fl in uses:
              key = (tool, sub)
              if key not in helps:
                  argv = [sys.executable, os.path.join("tools", tool + ".py")]
                  if sub:
                      argv.append(sub)
                  argv.append("--help")
                  r = subprocess.run(argv, capture_output=True, text=True)
                  helps[key] = r.stdout + r.stderr
              if fl not in helps[key]:
                  bad.append("%s: %s.py %s has no %s"
                             % (f, tool, sub or "(no subcommand)", fl))
          print("checked %d subcommands, %d bare invocation(s) with flags, "
                "%d flag uses" % (len(cmds), len(bare), len(uses)))
          for b in sorted(set(bad)):
              print("PROBLEM: " + b)
          sys.exit(1 if bad else 0)
          PY
