# Every tunable in the pipeline. Key these in once; the loop then runs
# unattended until a cap trips. Check what actually took effect with:
#   python3 tools/gspwn_config.py
# Unknown keys are rejected, so a typo in a cap fails loudly instead of
# silently reverting to a default.

track_k:
  enabled_syscalls:
    - "openat$nvidia*"
    - "mmap$nvidia*"
    - "ioctl$NV_*"
    - "ioctl$UVM_*"
    # nvidia-drm / /dev/dri are out of scope: a default container tenant
    # (compute,utility) never receives those nodes. See the README threat
    # model before adding them back.
  sandbox: "namespace"
  procs: 2                 # capped to protect 32GB RAM budget
  memory_max: "12G"        # systemd cgroup MemoryMax for syz-manager
  http: "127.0.0.1:56744"  # syz-manager stats; the coverage sampler reads this
  smoke_window_minutes: 30 # coverage must increase within this window

track_u:
  docker_image: "aflplusplus/aflplusplus:latest"
  memory_max: "8G"
  targets: []              # agent-facing: written by harness phase, read by fuzz phase

loop:
  # The campaign's declared stopping rules. The loop runs unattended until one
  # of them trips, so set them before starting, not after. They bound the
  # search, not the bill: this repo has no view of what an instance costs.
  # Watch real money in the AWS console.
  max_rounds: 3              # hard cap on rounds, whatever coverage does
  # Total run-hour budget, checked against the spend ledger state/spend.json.
  # round-end bills every campaign's measured hours there per run id (a run
  # that died early bills only what it sampled), so the cap counts every
  # campaign, not one per round: 3 rounds x 3 runs x 24h = 216.
  max_total_run_hours: 216
  campaign_hours: 24         # each campaign self-stops after this long
  stop_on_plateau: true      # stop early when coverage growth flattens
  # Plateau test, applied to the trailing window of the coverage curve.
  plateau_window_min: 240    # measure growth over the last 4h
  plateau_min_growth: 0.02   # < 2% new edges in that window = plateaued
  coverage_sample_min: 10    # sampler interval (systemd timer)
  corpus_policy: carry       # fresh | carry — carry builds each round on the last
  promote_seeds: true        # add coverage-advancing programs to the seed bank

orchestrator:
  # The agent that drives the pipeline is supervised by systemd so it comes
  # back after a kernel panic without anyone SSHing in. Install with:
  #   sudo python3 tools/orchestrator_ctl.py install
  #
  # No default command: this repo works with any AGENTS.md-aware coding agent
  # and will not guess which one is on the box. Set the headless invocation.
  #
  # {session} is replaced with a UUID this tool assigns. {anchor} is replaced
  # with a paragraph telling a resumed agent that its last turn predates the
  # interruption and that `pipeline_ctl.py brief` is authoritative.
  #
  # With Claude Code:
  #   command: "claude --session-id {session} -p 'Drive the pipeline per AGENTS.md.'"
  #   resume_command: "claude --resume {session} -p '{anchor}'"
  command: ""
  # Empty resume_command keeps every start fresh, which is always correct:
  # the state file, not the transcript, says where the pipeline is. Setting it
  # also carries the previous session's reasoning across a panic — what was
  # tried, what was ruled out — which the state file was never meant to hold.
  # When it is set, BOTH invocations must contain {session}: the id is
  # assigned and passed in, never discovered afterwards, because parsing it
  # out of agent output or globbing for the newest transcript races anything
  # else running on the box.
  resume_command: ""
  # Rotate to a fresh session after this many resumes. An unbounded transcript
  # is re-read on every restart and eventually auto-compacts, which drops
  # detail unpredictably; the fresh session re-anchors from `brief` instead.
  max_resumes: 20
  # Circuit breaker. Same-boot restarts and reboots are counted separately:
  # this pipeline panics the machine by design, so reboots are expected, while
  # an agent restarting on one boot means nothing is progressing and every
  # restart costs tokens.
  window_min: 60
  max_same_boot_starts: 5
  max_reboots: 10
