# Every tunable in the pipeline. Key these in once; the loop then runs
# unattended until a cap trips. Check what actually took effect with:
#   python3 tools/gspwn_config.py
# Unknown keys are rejected, so a typo in a cap fails loudly instead of
# silently reverting to a default.

track_k:
  enabled_syscalls:
    - "openat$nvidia*"
    - "mmap$nvidia*"
    - "ioctl$NV_*"
    - "ioctl$UVM_*"
    - "ioctl$DRM_IOCTL_NVIDIA_*"
  sandbox: "namespace"
  procs: 2                 # capped to protect 32GB RAM budget
  memory_max: "12G"        # systemd cgroup MemoryMax for syz-manager
  http: "127.0.0.1:56744"  # syz-manager stats; the coverage sampler reads this
  smoke_window_minutes: 30 # coverage must increase within this window

track_u:
  docker_image: "aflplusplus/aflplusplus:latest"
  memory_max: "8G"
  targets: []              # agent-facing: written by harness phase, read by fuzz phase

loop:
  # The campaign's declared stopping rules. The loop runs unattended until one
  # of them trips, so set them before starting, not after. They bound the
  # search, not the bill: this repo has no view of what an instance costs.
  # Watch real money in the AWS console.
  max_rounds: 3              # hard cap on rounds, whatever coverage does
  # Total run-hour budget, checked against the spend ledger state/spend.json.
  # round-end bills every campaign's measured hours there per run id (a run
  # that died early bills only what it sampled), so the cap counts every
  # campaign, not one per round: 3 rounds x 3 runs x 24h = 216.
  max_total_run_hours: 216
  campaign_hours: 24         # each campaign self-stops after this long
  stop_on_plateau: true      # stop early when coverage growth flattens
  # Plateau test, applied to the trailing window of the coverage curve.
  plateau_window_min: 240    # measure growth over the last 4h
  plateau_min_growth: 0.02   # < 2% new edges in that window = plateaued
  coverage_sample_min: 10    # sampler interval (systemd timer)
  corpus_policy: carry       # fresh | carry — carry builds each round on the last
  promote_seeds: true        # add coverage-advancing programs to the seed bank
