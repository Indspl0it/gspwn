# Every tunable in the pipeline. Key these in once; the loop then runs
# unattended until a cap trips. Check what actually took effect with:
#   python3 tools/gspwn_config.py
# Unknown keys are rejected, so a typo in a cap fails loudly instead of
# silently reverting to a default.

track_k:
  enabled_syscalls:
    - "openat$nvidia*"
    - "mmap$nvidia*"
    - "ioctl$NV_*"
    - "ioctl$UVM_*"
    # nvidia-drm / /dev/dri are out of scope: a default container tenant
    # (compute,utility) never receives those nodes. See the README threat
    # model before adding them back.
  sandbox: "namespace"
  procs: 2                 # capped to protect 32GB RAM budget
  memory_max: "12G"        # systemd cgroup MemoryMax for syz-manager
  http: "127.0.0.1:56744"  # syz-manager stats; the coverage sampler reads this
  smoke_window_minutes: 30 # coverage must increase within this window

track_u:
  docker_image: "aflplusplus/aflplusplus:latest"
  memory_max: "8G"
  # agent-facing: written by harness phase, read by fuzz phase. Each name is a
  # directory under harnesses/ and the output directory the fuzz
  # phase checks under /artifacts/runs/$RUN_ID/u/. Entry points and their
  # reachability are in harnesses/TARGETS.md. The Go target
  # go_cudacompat_elf is absent on purpose: go test -fuzz writes no
  # fuzzer_stats, so it produces no coverage output for the sampler to read.
  targets:
    - fuzz_ldcache
    - fuzz_path_resolve
    - fuzz_dsl_evaluate
    - fuzz_options_parse
    - fuzz_imex_channels
    - fuzz_path_join

loop:
  # The campaign's declared stopping rules. The loop runs unattended until one
  # of them trips, so set them before starting, not after. They bound the
  # search, not the bill: this repo has no view of what an instance costs.
  # Watch real money in the AWS console.
  # Backstop against a runaway loop, not the expected termination. The
  # campaign stops on completion: every one of the 764 enumerated targets is
  # either exercised or carries a written reason in the completion ledger
  # (pipeline_ctl.py surface-account). Against that denominator from an empty
  # corpus, a cap of 3 stopped every campaign long before completion could
  # hold, so completion was decorative. A campaign that reaches this cap has
  # failed to converge and the stop reason says so.
  max_rounds: 10
  # Total run-hour budget, checked against the spend ledger state/spend.json.
  # round-end bills every campaign's measured hours there per run id (a run
  # that died early bills only what it sampled), so the cap counts every
  # campaign, not one per round. This, and not max_rounds, is the spend
  # ceiling: 216 h is 9 campaigns of 24 h, whatever number of rounds they fall
  # across. Raise it before raising max_rounds buys anything.
  max_total_run_hours: 216
  campaign_hours: 24         # each campaign self-stops after this long
  # Stop early when both curves flatten. Overridable, unlike the completion
  # stop: a plateau is a judgement about what another campaign would buy,
  # while completion is a ledger identity with nothing left to fuzz. A flat
  # edge curve against a still-climbing surface curve is not a plateau and
  # does not trip this.
  stop_on_plateau: true
  # Plateau test, applied to the trailing window of the coverage curve.
  plateau_window_min: 240    # measure growth over the last 4h
  plateau_min_growth: 0.02   # < 2% new edges in that window = plateaued
  coverage_sample_min: 10    # sampler interval (systemd timer)
  corpus_policy: carry       # fresh | carry — carry builds each round on the last
  promote_seeds: true        # add coverage-advancing programs to the seed bank
  # How often the per-run deadline timer asks whether the window is up. Kept
  # separate from coverage_sample_min on purpose: raising the sampling
  # interval must not delay every campaign stop past the window it enforces.
  deadline_check_min: 2
  # Free space below which the tools warn. Kernel dumps, the corpus, the
  # coverage CSVs and the agent transcripts all land on one disk, and a full
  # one stops the fuzzer, the sampler and every state write at once. 0 = off.
  min_free_disk_gb: 20

orchestrator:
  # The agent that drives the pipeline is supervised by systemd so it comes
  # back after a kernel panic without anyone SSHing in. Install with:
  #   sudo python3 tools/orchestrator_ctl.py install
  #
  # No default command: this repo works with any AGENTS.md-aware coding agent
  # and will not guess which one is on the box. Set the headless invocation.
  #
  # {session} is replaced with a UUID this tool assigns. {anchor} is replaced
  # with a paragraph telling a resumed agent that its last turn predates the
  # interruption and that `pipeline_ctl.py brief` is authoritative.
  #
  # With Claude Code:
  #   command: "claude --session-id {session} -p 'Drive the pipeline per AGENTS.md.'"
  #   resume_command: "claude --resume {session} -p '{anchor}'"
  #   session_transcript_glob: "~/.claude/projects/*/{session}.jsonl"
  command: ""
  # Empty resume_command keeps every start fresh, which is always correct:
  # the state file, not the transcript, says where the pipeline is. Setting it
  # also carries the previous session's reasoning across a panic — what was
  # tried, what was ruled out — which the state file was never meant to hold.
  # When it is set, BOTH invocations must contain {session}: the id is
  # assigned and passed in, never discovered afterwards, because parsing it
  # out of agent output or globbing for the newest transcript races anything
  # else running on the box.
  resume_command: ""
  # Rotation is by transcript SIZE, because size is what drives auto-
  # compaction. Restart count does not: a campaign that panics twenty times in
  # an hour writes almost nothing, one that panics twice in three days writes
  # a lot.
  #
  # Measured on one real 20-hour session: compaction fired three times, after
  # 1.66, 2.01 and 2.54 MB of new transcript, so roughly every 2 MB. One
  # compaction is survivable; the damage is compound, because the third
  # summarises the second's summary. 6 MB is about three compactions, which is
  # where re-anchoring from `brief` starts to beat another lossy pass. n=1, so
  # revisit it once real campaigns have run. 0 turns the size check off.
  max_session_mb: 6
  # Where the transcript lives, with {session} substituted. Without it the
  # size check cannot run and the orchestrator warns rather than silently
  # falling back to counting restarts.
  session_transcript_glob: ""
  # Backstop for when the transcript cannot be measured. Deliberately loose:
  # it is a poor proxy and should rarely be what rotates a session.
  max_resumes: 40
  # Circuit breaker. Same-boot restarts and reboots are counted separately:
  # this pipeline panics the machine by design, so reboots are expected, while
  # an agent restarting on one boot means nothing is progressing and every
  # restart costs tokens.
  window_min: 60
  max_same_boot_starts: 5
  max_reboots: 10
  # Wall-clock ceiling on one agent launch. The breaker counts starts, not
  # stalls, so without this an agent blocked on a prompt or a wedged tool
  # holds the pipeline open indefinitely while the instance bills. It must
  # exceed loop.campaign_hours, because the fuzz phase waits out the whole
  # campaign window inside a single launch. 0 disables the timeout.
  max_agent_hours: 0
  # Substituted for {anchor} in resume_command. The first thing a resumed
  # agent reads after a panic, and what stops it from continuing a
  # half-finished tool call issued at the moment the kernel died.
  #
  # No apostrophes or double quotes: it goes into a shell command line the
  # operator has already quoted, and a quote here would end that quoting.
  # Validation refuses one rather than letting an edit break the launch.
  resume_anchor: >-
    This session has resumed after an interruption. Your most recent turn
    predates a kernel panic, a reboot or a restart, so anything it says about
    what is running or what phase you were in is stale. Do not act on it.
    Run: python3 tools/pipeline_ctl.py brief -- its output is authoritative
    and your memory is not. Then continue from the phase it reports,
    following AGENTS.md. Your earlier reasoning about the target is still
    useful; your earlier belief about the machine is not.

agent:
  # What the agent actually reads. `pipeline_ctl.py brief` is the resume
  # anchor: after a panic it is the whole of what a fresh context knows, so
  # how much it carries is a tuning knob for the agent's effectiveness, not a
  # display preference. Carry too little and the agent re-derives what an
  # earlier round already settled; carry too much and the anchor costs the
  # context it exists to save.
  brief_knowledge_entries: 3    # per file (learnings, mistakes)
  brief_knowledge_line_chars: 100  # first line of each, cut to this
  brief_max_problems: 5         # before deferring to `validate`
  # Crash titles in `crash-list`. Kernel report titles put the distinguishing
  # part at the end often enough that cutting early makes two different bugs
  # look like the same line of output.
  crash_title_chars: 70

coverage:
  # How the plateau decision is made. Coverage is the only signal that decides
  # whether to run another round, so these are the numbers the campaign's
  # stopping rule rests on.
  #
  # The verdict is an extrapolation from a fitted species-accumulation curve
  # (edges discovered against inputs executed), not a growth threshold. The
  # question the loop asks is how many new edges another campaign is expected
  # to find, which is in the units of the thing being predicted. A growth
  # percentage is not: the same percentage means ten edges early in a run and
  # a thousand late in one.
  #
  # Two limits. Coverage is kernel-side reachable code only, and GSP firmware
  # is not instrumented, so no verdict here says anything about it. 236 of the
  # 767 non-privileged control commands have their handler compiled out and
  # run on GSP: a corpus drifting onto those raises executions and never
  # edges, which is indistinguishable from exhaustion by edge count alone.
  # And an aggregate edge counter cannot support a "we have covered X% of the
  # driver" claim, which needs per-edge frequency counts syz-manager does not
  # report.
  #
  # tools/surface_cov.py measures the other axis, over a denominator the
  # driver enumerates itself: 764 reachable commands, of which the corpus
  # names some. That is a claim about the command surface and never about
  # lines of driver code, and it separates the two readings of a plateau.
  # coverage_ctl.py records it as the `surface` column and reads the two
  # curves together:
  #
  #   edge flat, surface climbing   not a plateau
  #   both flat, ledger open        the corpus is stuck
  #   both flat, ledger closed      complete, and the loop stops
  #
  # The ledger is closed when exercised plus accounted-for reaches the whole
  # denominator, where every unreached target carries a written reason
  # (pipeline_ctl.py surface-account). No percentage threshold decides it, so
  # the five fit knobs below govern the edge curve alone, whose asymptote is
  # unknown and has to be extrapolated. The three surface_ keys at the end of
  # this section govern how often the surface curve is sampled and how many
  # samples its shape is read from.
  plateau_new_edges: 50   # expected new edges over one more campaign, below
                          # which the run has plateaued. Set it to what would
                          # actually justify another campaign of machine time
  horizon_hours: 24       # how far ahead to extrapolate; match campaign_hours
  model_min_r2: 0.90      # below this the curve is not described well enough
                          # to extrapolate from, and the verdict is unknown
  min_fit_samples: 8      # points required before extrapolating at all
  fit_tail_fraction: 0.5  # share of the run's EXECUTIONS the fit covers. The
                          # decision is about the regime the fuzzer is in now:
                          # fitting the whole run lets the early steep phase
                          # dominate, so a run that climbed hard then went
                          # flat still reports a healthy exponent. 1.0 = all
  beta_tolerance: 0.05    # slack above beta=1 before the series is judged not
                          # to be an accumulation curve
  # How long to wait for nvidia-smi before calling the driver wedged. A dead
  # GPU fails fast; a hung one blocks, which is what this bounds. Track K
  # only — the container-toolkit harnesses never touch the GPU, so their
  # samples record the GPU column as not applicable.
  gpu_probe_timeout_sec: 20
  # Minutes between surface samples. Unlike every other column in the coverage
  # CSV this one is not an HTTP GET: it unpacks the run's corpus.db and
  # rescans every program in it, so it runs on its own coarser cadence and the
  # rows in between record no surface value. Raise it on a large corpus, where
  # the rescan costs real time; 0 measures it on every coverage sample.
  # Override for one run with GSPWN_SURFACE_SAMPLE_MIN.
  surface_sample_min: 60
  # Surface samples needed before the curve's shape is read at all. Higher
  # than min_fit_samples' role for the edge curve because the surface counter
  # is quantised: it is an integer with long flat stretches between steps, and
  # a short tail sitting between two steps is a common state. Below 2 there is
  # nothing to compare against and every run would read as flat from its first
  # measurement. Override with GSPWN_SURFACE_MIN_SAMPLES.
  surface_min_samples: 5
  # Seconds syz-db may take to unpack one run corpus for a surface
  # measurement. It scales with corpus size and disk speed, so a long campaign
  # on a slow volume needs more than a smoke run does. On a timeout the
  # surface reading is recorded as absent, never as 0. Override with
  # GSPWN_UNPACK_TIMEOUT_SEC.
  unpack_timeout_sec: 300

poc:
  # What counts as a reproduction, and how long one may take. A reliable
  # classification is what a disclosure package is built on, so these are
  # research knobs rather than tool internals.
  repro_timeout_sec: 120   # per run; a hang past this is a hit only for a
                           # hang-class crash title, otherwise a void run
  reliable_threshold: 0.8  # at or above this hit rate: reliable, else flaky
  default_runs: 10         # counted runs `verify` aims for without --runs
  # Void runs (a wrapped dmesg ring, an interrupted run) do not advance the
  # count, so verify retries. At most this many attempts per still-needed
  # counted run, plus a small fixed slack, so a persistently wrapping ring
  # cannot loop forever.
  void_retry_factor: 2

triage:
  # Dedup depth. These decide whether two reports are the same bug, which
  # decides what reaches rca and what the next round hunts.
  #
  # CAUTION: change them between campaigns, not during one. Existing hashes
  # are not recomputed, so across a mid-campaign change one bug can register
  # twice and two bugs can merge into one that never reaches rca. The settings
  # in force at the first registration are recorded in the state file, and
  # `pipeline_ctl.py validate` reports it if they move underneath the registry.
  stack_hash_frames: 3   # fewer merges distinct bugs sharing a caller;
                         # more splits one bug whose stack varies by inlining
  signature_frames: 5    # frames a reproduction must match to count as a hit
  # Fallback identity for a report with no usable stack at all: a lone
  # "BUG: unable to handle ..." or a trace-less panic. With no frames to hash,
  # the only distinguishing evidence is the wording around the start line,
  # normalized so timestamps, hex addresses and pids do not make every
  # occurrence unique. Too narrow and one panic registers as many bugs,
  # burying the real ones in the queue; too wide and two different panics
  # sharing a prologue merge, so the second never reaches rca.
  # These bound the prologue wording only. The faulting function (RIP) is
  # always part of the identity, matched by pattern wherever it sits in the
  # report, so neither knob can drop it.
  frameless_signature_lines: 5   # report lines that form the signature
  frameless_signature_chars: 300 # of that normalized wording, how much is
                                 # actually hashed
